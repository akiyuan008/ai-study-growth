name: ai_study_growth
description: "智析录：AI 学习成长系统——AI 错题本 × 成长引擎"
publish_to: 'none'
version: 0.11.0+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 / 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # 数据层（事件溯源 + 实体表，单一事实源）
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # AI Provider（OpenAI 兼容，流式输出）
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # 学习域
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  camera: ^0.11.0
  fl_chart: ^0.69.0

  # 基础工具
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0

  # 云备份（Part 4）
  archive: ^3.6.1
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.0.5
  supabase_flutter: ^2.8.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  http: ^1.2.0
  share_plus: ^10.0.2

  # PDF 导出（Part 6.2：离线生成，打印/分享）
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/taxonomy/high_school_taxonomy.json
  fonts:
    - family: LxgwWenKai
      fonts:
        - asset: assets/fonts/LxgwWenKaiLite.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

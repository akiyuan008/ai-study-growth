name: ai_study_growth
description: "AI 学习成长系统：自律学习 × AI 错题本 融合重构"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 / 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # 数据层（事件溯源 + 实体表，单一事实源）
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # AI Provider（OpenAI 兼容，流式输出）
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # 学习域
  fsrs: ^2.0.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

  # 基础工具
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Analyze & Test 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze (error/warning 门禁)
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        # 只构建 ARM（去 x86 系，OpenCV 原生库体积控制）
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64
      - name: Get version
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER//+/-}" >> "$GITHUB_OUTPUT"
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body: |
            自动构建于 ${{ github.event.head_commit.message }}
            提交: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact (PR)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
